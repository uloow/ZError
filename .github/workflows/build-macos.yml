name: Build macOS

# 每周一 11:00（北京时间）自动检查上游，有更新就构建；也可手动触发
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: '上游没有新提交也强制重新构建'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: macos-build
  cancel-in-progress: false

env:
  UPSTREAM_OWNER: Miaozeqiu
  UPSTREAM_REPO: ZError
  UPSTREAM_BRANCH: dev-improvements
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    # macos-14 及以后的 GitHub 托管 runner 是 Apple Silicon
    runs-on: macos-14
    steps:
      - name: 检查上游是否有新提交
        id: check
        run: |
          set -euo pipefail
          upstream_sha=$(gh api "repos/$UPSTREAM_OWNER/$UPSTREAM_REPO/commits/$UPSTREAM_BRANCH" --jq .sha)
          last_sha=$(gh release view --json body --jq .body 2>/dev/null \
            | sed -n 's/.*upstream-sha: \([0-9a-f]\{40\}\).*/\1/p' | head -1 || true)

          echo "上游最新提交: $upstream_sha"
          echo "上次构建提交: ${last_sha:-（无记录）}"

          if [ "$upstream_sha" = "$last_sha" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "上游无更新，跳过构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: 检出构建套件（补丁 + 本文档）
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          path: kit

      - name: 检出上游源码
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          path: src
          fetch-depth: 1

      - name: 应用补丁
        id: patch
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          failed=0
          for p in ../kit/patches/*.patch; do
            echo "── apply $(basename "$p")"
            if ! git apply --3way "$p"; then
              echo "::error::补丁应用失败：$(basename "$p")"
              failed=1
              failed_name=$(basename "$p")
              break
            fi
          done
          if [ "$failed" = "1" ]; then
            gh issue create \
              --title "补丁冲突：$failed_name 无法应用（上游 $(date +%Y-%m-%d) 更新）" \
              --body "上游 \`$UPSTREAM_BRANCH\` 更新到 \`${{ steps.check.outputs.upstream_sha }}\` 后，补丁 \`$failed_name\` 无法自动应用。

          需要人工处理：在本地基于新上游重新打这个补丁，然后更新 \`patches/$failed_name\`。

          本次构建已跳过，不会产出错误的安装包。" || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: 环境信息
        if: steps.check.outputs.skip == 'false'
        run: |
          uname -m
          sw_vers

      - name: Setup Node
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Setup Rust
        if: steps.check.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        if: steps.check.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri -> target

      - name: 安装前端依赖
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        run: npm ci

      - name: 构建 .app
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          # 只出 .app：Tauri 自带的 dmg 打包要驱动 Finder，CI 里会失败，下面用 hdiutil 手工封
          ./node_modules/.bin/tauri build -b app

      - name: 读取版本号并封 DMG
        id: pkg
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH=$(uname -m)
          APP="src-tauri/target/release/bundle/macos/ZError.app"
          DMG="ZError_${VERSION}_${ARCH}.dmg"

          test -d "$APP" || { echo "::error::没找到 $APP"; exit 1; }

          rm -rf /tmp/dmg-staging && mkdir -p /tmp/dmg-staging
          cp -R "$APP" /tmp/dmg-staging/
          ln -s /Applications /tmp/dmg-staging/Applications
          hdiutil create -volname "ZError" -srcfolder /tmp/dmg-staging -ov -format UDZO "$DMG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      - name: 生成 Release 说明
        id: notes
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          {
            echo "## ZError ${VERSION} · macOS 构建"
            echo
            echo "基于上游 [\`dev-improvements\`](https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/tree/${UPSTREAM_BRANCH}) 自动构建，未签名。"
            echo
            echo "安装：下载 DMG → 拖进「应用程序」→ **首次运行右键 →「打开」**（未签名会被 Gatekeeper 拦）。"
            echo
            echo "本构建已合入 6 个 macOS 修复补丁，详见 [patches/](./patches)。"
            echo
            echo "<!-- upstream-sha: ${{ steps.check.outputs.upstream_sha }} -->"
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: 发布 Release
        if: steps.check.outputs.skip == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          TAG="v${VERSION}-macos"

          # 同一版本重复构建时避免 tag 冲突
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}-b${GITHUB_RUN_NUMBER}"
          fi

          gh release create "$TAG" "${{ steps.pkg.outputs.dmg }}" \
            --title "ZError ${VERSION} macOS" \
            --notes-file /tmp/release-notes.md
          echo "已发布：$TAG"

      - name: 上传构建产物（保留 30 天）
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ZError-${{ steps.pkg.outputs.version }}-${{ steps.pkg.outputs.arch }}
          path: src/${{ steps.pkg.outputs.dmg }}
          retention-days: 30
          if-no-files-found: error

      - name: 构建失败自动开 issue
        if: failure() && steps.patch.outcome != 'failure'
        run: |
          gh issue create \
            --title "自动构建失败（$(date +%Y-%m-%d)）" \
            --body "上游 \`$UPSTREAM_BRANCH\` @ \`${{ steps.check.outputs.upstream_sha }}\` 的自动构建失败了。

          查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
